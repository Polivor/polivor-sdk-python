[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polivor"
version = "0.1.0"
description = "Python client for the Polivor API, generated from its OpenAPI file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.23.1,<0.29.0", "attrs>=22.2.0", "python-dateutil>=2.8.0", "PyJWT[crypto]>=2.10.1,<3"]

[tool.setuptools.packages.find]
include = ["polivor*"]

[tool.setuptools.package-data]
polivor = ["py.typed", "generated/py.typed"]

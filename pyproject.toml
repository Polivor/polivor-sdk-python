[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polivor"
version = "0.1.0"
description = "Python client for the Polivor API, generated from its OpenAPI file."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx>=0.23.1,<0.29.0", "attrs>=22.2.0", "python-dateutil>=2.8.0", "PyJWT[crypto]>=2.10.1,<3"]

[tool.setuptools.packages.find]
include = ["polivor*"]

[tool.setuptools.package-data]
polivor = ["py.typed", "generated/py.typed"]

[project.urls]
Homepage = "https://polivor.com/docs"
Repository = "https://github.com/Polivor/polivor-sdk-python"
Issues = "https://github.com/Polivor/polivor-sdk-python/issues"

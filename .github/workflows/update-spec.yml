name: update-spec
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SPEC_URL: https://api.staging.polivor.com/docs/openapi.yaml

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: curl --fail --silent --show-error --location "$SPEC_URL" --output openapi/polivor.yaml
      - run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-virtualenv -r requirements-dev.txt
          PATH="$RUNNER_TEMP/venv/bin:$PATH" ./generate.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-openapi-spec
          commit-message: Update the generated client to the current API description
          title: Update the generated client to the current API description
          body: The published OpenAPI file changed. This regenerates the client from it; review the diff for breaking changes before merging.
